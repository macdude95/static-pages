<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STARFLEET TERMINAL</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a;
  color: #00ff88;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
  padding: 16px;
  overflow-x: hidden;
}
/* Scanlines overlay */
body::after {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 255, 136, 0.03) 2px,
    rgba(0, 255, 136, 0.03) 4px
  );
  pointer-events: none;
  z-index: 999;
}
#terminal {
  max-width: 600px;
  margin: 0 auto;
}
.header {
  border-bottom: 1px solid #00ff88;
  padding-bottom: 8px;
  margin-bottom: 16px;
  text-align: center;
}
.header h1 { font-size: 16px; letter-spacing: 2px; }
.header .version { font-size: 11px; color: #008844; }
.content { white-space: pre-wrap; margin-bottom: 16px; }
.menu-item {
  display: block;
  background: none;
  border: 1px solid #00ff88;
  color: #00ff88;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  padding: 10px 14px;
  margin: 6px 0;
  width: 100%;
  text-align: left;
  cursor: pointer;
  transition: background 0.1s;
}
.menu-item:hover, .menu-item:active {
  background: #00ff8822;
}
.menu-item.locked { border-color: #ff4444; color: #ff4444; }
.back-btn {
  display: inline-block;
  margin-top: 16px;
  padding: 8px 14px;
  border: 1px solid #008844;
  color: #008844;
  background: none;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  cursor: pointer;
}
.back-btn:hover { border-color: #00ff88; color: #00ff88; }
.input-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.input-row input {
  flex: 1;
  background: #111;
  border: 1px solid #00ff88;
  color: #00ff88;
  font-family: 'Courier New', monospace;
  font-size: 16px;
  padding: 10px;
  text-transform: uppercase;
}
.input-row input::placeholder { color: #006633; }
.input-row button {
  background: #00ff88;
  color: #0a0a0a;
  border: none;
  padding: 10px 16px;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}
.triple-input { margin-top: 12px; }
.triple-input label { display: block; margin-top: 10px; margin-bottom: 4px; }
.triple-input input {
  width: 100%;
  background: #111;
  border: 1px solid #00ff88;
  color: #00ff88;
  font-family: 'Courier New', monospace;
  font-size: 16px;
  padding: 10px;
  text-transform: uppercase;
}
.triple-input input::placeholder { color: #006633; }
.submit-btn {
  display: block;
  width: 100%;
  margin-top: 12px;
  background: #00ff88;
  color: #0a0a0a;
  border: none;
  padding: 12px 16px;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}
.error { color: #ff4444; margin-top: 8px; }
.success { color: #00ffcc; }
.highlight { color: #ffcc00; }
.dim { color: #006633; }
.warn { color: #ffaa00; }
b { color: #44ffaa; font-weight: bold; }
.progress-bar {
  width: 100%;
  height: 20px;
  border: 1px solid #00ff88;
  margin-top: 12px;
  background: #111;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: #00ff88;
  transition: width 0.2s;
}
.decrypt-screen { text-align: center; }
.separator { border-top: 1px solid #004422; margin: 12px 0; }
@keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
.cursor::after { content: "▋"; animation: blink 1s infinite; }
/* Boot sequence */
#boot-screen {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #0a0a0a;
  z-index: 1000;
  padding: 16px;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}
#boot-text {
  max-width: 600px;
  width: 100%;
  white-space: pre-wrap;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  color: #008844;
  line-height: 1.8;
}
#boot-text .ok { color: #00ff88; }
#boot-text .warn { color: #ffaa00; }
/* Final message glow */
@keyframes glow-pulse {
  0% { box-shadow: 0 0 0px #00ff8800; }
  50% { box-shadow: 0 0 30px #00ff8844; }
  100% { box-shadow: 0 0 0px #00ff8800; }
}
.glow { animation: glow-pulse 2s ease-in-out; }
.transmission-complete {
  margin-top: 16px;
  text-align: center;
  opacity: 0;
  transition: opacity 1s;
  color: #008844;
  font-size: 12px;
  letter-spacing: 2px;
}
.transmission-complete.visible { opacity: 1; }
</style>
</head>

function runBoot() {
  const bootText = document.getElementById('boot-text');
  let i = 0;
  function nextLine() {
    if (i >= bootLines.length) {
      setTimeout(() => {
        document.getElementById('boot-screen').style.display = 'none';
        document.getElementById('terminal').style.display = '';
        render('main');
      }, 400);
      return;
    }
    bootText.innerHTML += bootLines[i].text + '\n';
    const delay = bootLines[i].delay;
    i++;
    setTimeout(nextLine, delay);
  }
  setTimeout(nextLine, 500);
}

const PASSWORD = 'QUILL SPIKE SONIC';

function render(screenId) {
  const screen = screens[screenId];
  const el = document.getElementById('screen');
  let html = `<div class="content">${screen.content}</div>`;

  if (screen.options) {
    screen.options.forEach(opt => {
      const cls = opt.locked ? 'menu-item locked' : 'menu-item';
      html += `<button class="${cls}" onclick="render('${opt.target}')">${opt.label}</button>`;
    });
  }

  if (screen.input === 'triple') {
    html += `<div class="triple-input">
      <label class="dim">WORD 1:</label>
      <input type="text" id="code-1" placeholder="CREW CODE" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <label class="dim">WORD 2:</label>
      <input type="text" id="code-2" placeholder="SENSOR TAG" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <label class="dim">WORD 3:</label>
      <input type="text" id="code-3" placeholder="SENSOR TAG" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="submit-btn" onclick="checkTriple()">AUTHENTICATE</button>
    </div>
    <div id="error-msg"></div>`;
  }

  if (screen.back) {
    html += `<button class="back-btn" onclick="render('${screen.back}')">[0] Back</button>`;
  }

  el.innerHTML = html;

  if (screen.input === 'triple') {
    document.getElementById('code-1').focus();
  }

  window.scrollTo(0, 0);
}

function checkTriple() {
  const w1 = document.getElementById('code-1').value.trim().toUpperCase();
  const w2 = document.getElementById('code-2').value.trim().toUpperCase();
  const w3 = document.getElementById('code-3').value.trim().toUpperCase();
  const phrase = `${w1} ${w2} ${w3}`;
  
  const el = document.getElementById('screen');
  el.innerHTML = `<div class="decrypt-screen">
    <div class="content">VALIDATING ACCESS CODES...</div>
    <div class="progress-bar"><div class="progress-fill" id="val-fill"></div></div>
    <div class="content dim" id="val-status">0%</div>
  </div>`;

  let progress = 0;
  const fill = document.getElementById('val-fill');
  const status = document.getElementById('val-status');
  const interval = setInterval(() => {
    progress += Math.random() * 20 + 10;
    if (progress >= 100) {
      progress = 100;
      clearInterval(interval);
      setTimeout(() => {
        if (phrase === PASSWORD) {
          showDecrypting();
        } else {
          render('comms_locked');
          setTimeout(() => {
            const err = document.getElementById('error-msg');
            if (err) err.innerHTML = '<p class="error">[ACCESS DENIED — AUTHORIZATION FAILED — RETRY]</p>';
          }, 50);
        }
      }, 300);
    }
    fill.style.width = progress + '%';
    status.textContent = Math.floor(progress) + '%';
  }, 150);
}

function showDecrypting() {
  const el = document.getElementById('screen');
  el.innerHTML = `<div class="decrypt-screen">
    <div class="content"><span class="success">✓ CODES ACCEPTED</span>\n\nDECRYPTING TRANSMISSION...</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="content dim" id="decrypt-status">0%</div>
  </div>`;
  
  let progress = 0;
  const fill = document.getElementById('progress-fill');
  const status = document.getElementById('decrypt-status');
  const interval = setInterval(() => {
    progress += Math.random() * 15 + 5;
    if (progress >= 100) {
      progress = 100;
      clearInterval(interval);
      setTimeout(() => typeMessage(), 400);
    }
    fill.style.width = progress + '%';
    status.textContent = Math.floor(progress) + '%';
  }, 200);
}

    { text: '— Starfleet Intelligence', cls: 'dim' },
  ];

  el.innerHTML = '<div class="content" id="typed-output"></div><div class="transmission-complete" id="tx-complete">[ TRANSMISSION COMPLETE — STARDATE 05.04.2026 ]</div><button class="back-btn" onclick="render(\'comms\')" style="display:none" id="back-btn-typed">[0] Back</button>';
  const output = document.getElementById('typed-output');
  let lineIdx = 0;

  function typeLine() {
    if (lineIdx >= lines.length) {
      // Glow pulse on terminal
      document.getElementById('terminal').classList.add('glow');
      // Show transmission complete
      setTimeout(() => {
        document.getElementById('tx-complete').classList.add('visible');
        document.getElementById('back-btn-typed').style.display = '';
      }, 800);
      return;
    }
    const line = lines[lineIdx];
    const span = document.createElement('span');
    if (line.cls) span.className = line.cls;
    output.appendChild(span);
    
    let charIdx = 0;
    const text = line.text || ' ';
    function typeChar() {
      if (charIdx < text.length) {
        span.textContent += text[charIdx];
        charIdx++;
        setTimeout(typeChar, 18 + Math.random() * 12);
      } else {
        output.appendChild(document.createTextNode('\n'));
        lineIdx++;
        setTimeout(typeLine, 60);
      }
    }
    typeChar();
  }
  typeLine();
}

// Start boot sequence
runBoot();
</script>
